apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sentinelstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: sentinelstream-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKER_PORT
              value: "8001"
            - name: API_URL
              value: "http://backend:3000"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: WORKER_SECRET
              value: "internal_worker_secret"
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: sentinelstream
spec:
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: worker
